<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Popup Example</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <nav>
    <div class="logo-container">
      <img src="IT LOGO.png" alt="CET Logo" class="logo" />
    </div>
    <div class="nav-items">
      <a href="/">Dash</a>
      <a href="/">About</a>
      <a href="/">Contact</a>
    </div>
  </nav>

  <main>
    <section class="hero">
      <div class="hero-container">
        <div class="column-left">
          <h1>Not Apple</h1>
          <p>
            Bachelor of Science in Information Technology and Bachelor of Library and Information Science students.
          </p>
          <button id="popupBtn">Click me</button>
        </div>
        <div class="column-right">
          <img src="IT LOGO.png" alt="illustration" class="hero-image" />
        </div>
      </div>
    </section>
  </main>
</body>
</html>
